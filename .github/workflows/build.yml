name: Build and test Mimicry

on:
  push:
    branches: [ "**" ]
  schedule:
    - cron: "0 2 * * *"   # nightly, default branch only

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test (fast)
      if: github.event_name == 'push'
      run: ctest --test-dir build -C Release -LE slow --output-on-failure

    - name: Test (all)
      if: github.event_name == 'schedule'
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: mimicry-${{ runner.os }}
        path: |
          build/mimicry
          build/mimicry_worker
          build/mimicry_test_synth.clap
          build/Release/mimicry.exe
          build/Release/mimicry_worker.exe
          build/Release/mimicry_gui.exe
          build/Release/mimicry_test_synth.clap
        if-no-files-found: ignore
